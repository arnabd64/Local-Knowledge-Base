[project]
name = "local-knowledge-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "arnabd64", email = "arnabdhar32@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[tool.uv]
add-bounds = "major"
no-cache = true
